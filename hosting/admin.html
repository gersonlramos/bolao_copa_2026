<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Bolão Copa 2026</title>
    <style>
      :root {
        --green: #1b5e20;
        --green-light: #4caf50;
        --gold: #f9a825;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f4f6f8;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #fff;
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 4px 32px rgba(0, 0, 0, 0.1);
      }
      .logo {
        color: var(--green);
        font-size: 1.4rem;
        font-weight: 800;
        text-align: center;
        margin-bottom: 8px;
      }
      .subtitle {
        color: #888;
        text-align: center;
        font-size: 0.9rem;
        margin-bottom: 32px;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 0.85rem;
        margin-bottom: 6px;
        color: var(--green);
        margin-top: 16px;
      }
      input {
        width: 100%;
        border: 2px solid #ddd;
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.15s;
      }
      input:focus { border-color: var(--green); }
      .btn {
        width: 100%;
        margin-top: 20px;
        background: var(--green);
        color: #fff;
        border: none;
        border-radius: 50px;
        padding: 14px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn:hover { background: #2e7d32; }
      .btn:disabled { background: #aaa; cursor: not-allowed; }
      .result {
        margin-top: 16px;
        border-radius: 10px;
        padding: 14px;
        font-size: 0.9rem;
        text-align: center;
        display: none;
      }
      .result.success { background: #e8f5e9; color: #2e7d32; }
      .result.error   { background: #ffebee; color: #c62828; }
      .divider {
        border: none;
        border-top: 1px solid #eee;
        margin: 28px 0;
      }
      .stats { text-align: center; }
      .stats h3 {
        font-size: 0.8rem;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 8px;
      }
      .stats .number {
        font-size: 2.4rem;
        font-weight: 800;
        color: var(--green);
      }
      .stats .label { font-size: 0.85rem; color: #888; }
      .tip {
        margin-top: 20px;
        font-size: 0.8rem;
        color: #aaa;
        text-align: center;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">⚽ Bolão Copa 2026</div>
      <p class="subtitle">Painel administrativo</p>

      <label for="admin-key">Código de acesso</label>
      <input type="password" id="admin-key" placeholder="••••••••••••" />

      <label for="vip-email">E-mail do usuário para liberar VIP</label>
      <input type="email" id="vip-email" placeholder="usuario@email.com" />

      <button class="btn" id="btn-grant" onclick="grantVip()">
        ⭐ Liberar VIP
      </button>

      <div class="result" id="result"></div>

      <p class="tip">
        O código de acesso é o <strong>ADMIN_KEY</strong> definido no arquivo
        <code>functions/.env</code>
      </p>

      <hr class="divider" />

      <div class="stats">
        <h3>Downloads totais</h3>
        <div class="number" id="dl-count">—</div>
        <div class="label">desde o lançamento</div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCGC-oCFCs1D4kJOjxZReSqZOyFt3QmRwk",
        authDomain: "bolao-copa-2026-4dfc5.web.app",
        projectId: "bolao-copa-2026-4dfc5",
        storageBucket: "bolao-copa-2026-4dfc5.appspot.com",
        messagingSenderId: "98850868123",
        appId: "1:98850868123:web:ad5dfac62eaf701f202f3e",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      const functions = firebase.app().functions("southamerica-east1");

      // Load download count
      db.collection("config").doc("stats").get().then((doc) => {
        const count = doc.exists ? doc.data().downloadCount || 0 : 0;
        document.getElementById("dl-count").textContent =
          count.toLocaleString("pt-BR");
      });

      async function grantVip() {
        const adminKey = document.getElementById("admin-key").value.trim();
        const email = document.getElementById("vip-email").value.trim();
        const btn = document.getElementById("btn-grant");
        const result = document.getElementById("result");

        if (!adminKey) { showResult("error", "Informe o código de acesso."); return; }
        if (!email)    { showResult("error", "Informe o e-mail do usuário."); return; }

        btn.disabled = true;
        btn.textContent = "Aguarde...";
        result.style.display = "none";

        try {
          const fn = functions.httpsCallable("grantVip");
          await fn({ adminKey, userEmail: email });
          showResult("success", `✓ VIP liberado para ${email}`);
          document.getElementById("vip-email").value = "";
        } catch (e) {
          showResult("error", "Erro: " + e.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "⭐ Liberar VIP";
        }
      }

      function showResult(type, msg) {
        const el = document.getElementById("result");
        el.className = "result " + type;
        el.textContent = msg;
        el.style.display = "block";
      }
    </script>
  </body>
</html>
